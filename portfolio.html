<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Capibara Designs</title>
  <meta name="description" content="Découvrez le portfolio de Capibara Designs : logos, moodboards, présentations PowerPoint et cartes de visite, photographiés avec amour par notre capybara.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --cream:#FFF6EF;
      --cream-deep:#FBEBDD;
      --pink:#F4A9C5;
      --pink-soft:#FCE0EB;
      --pink-deep:#E88AAE;
      --sage:#A9C9A4;
      --sage-deep:#7FA876;
      --sage-soft:#E4EFDF;
      --plum:#4A3540;
      --plum-soft:#8B7580;
      --peach:#FFD9B8;
      --white:#FFFFFF;
      --shadow:0 15px 40px rgba(74,53,64,.12);
    }

    *{box-sizing:border-box; margin:0; padding:0;}

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{
      font-family:'Quicksand',sans-serif;
      background:var(--cream);
      color:var(--plum);
    }

    button,a{font:inherit;}

    /* ===== PAGE ===== */
    .portfolio-page{
      width:100%;
      height:100vh;
      position:relative;
      overflow:hidden;
      isolation:isolate;
      background:
        linear-gradient(rgba(255,246,239,.88), rgba(255,246,239,.88)),
        url("logo.png") center center / cover no-repeat;
    }

    /* ===== BACKGROUND GLOW ===== */
    .background-blob{
      position:absolute;
      width:580px; height:580px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(244,169,197,.38) 0%, rgba(244,169,197,.15) 38%, transparent 72%);
      filter:blur(18px);
      opacity:.72;
      top:-240px; right:-170px;
      pointer-events:none;
      z-index:0;
      animation:ambientGlow 6s ease-in-out infinite;
    }
    .background-blob.two{
      width:500px; height:500px;
      background:radial-gradient(circle, rgba(169,201,164,.32) 0%, rgba(169,201,164,.13) 38%, transparent 72%);
      top:auto; right:auto;
      bottom:-240px; left:-170px;
      animation:ambientGlow 7s ease-in-out infinite reverse;
    }
    @keyframes ambientGlow{
      0%,100%{transform:scale(1);opacity:.68;}
      50%{transform:scale(1.08);opacity:.95;}
    }

    /* ===== GARLAND (حبل الصور المعلقة) ===== */
    .garland{
      position:absolute;
      top:0; left:0;
      width:100%;
      z-index:1;
      pointer-events:none;
    }

    /* ===== FLOATING HEARTS & STARS ===== */
    .floating-hearts{
      position:absolute; inset:0;
      z-index:8;
      pointer-events:none;
      overflow:hidden;
    }
    .floating-hearts span{
      position:absolute;
      bottom:-40px;
      font-size:18px;
      opacity:0;
      filter:drop-shadow(0 4px 8px rgba(232,138,174,.16));
      animation:heartFloat 7s linear infinite;
    }
    .floating-hearts span:nth-child(1){left:12%;animation-delay:0s;animation-duration:7.5s;}
    .floating-hearts span:nth-child(2){left:28%;animation-delay:2.2s;animation-duration:8.5s;font-size:14px;}
    .floating-hearts span:nth-child(3){left:47%;animation-delay:4s;animation-duration:7s;font-size:20px;}
    .floating-hearts span:nth-child(4){left:68%;animation-delay:1.2s;animation-duration:9s;font-size:15px;}
    .floating-hearts span:nth-child(5){left:84%;animation-delay:3s;animation-duration:7.8s;font-size:21px;}
    .floating-hearts span:nth-child(6){left:92%;animation-delay:5s;animation-duration:8.8s;font-size:13px;}
    @keyframes heartFloat{
      0%{transform:translateY(0) translateX(0) rotate(-8deg) scale(.8);opacity:0;}
      12%{opacity:.7;}
      50%{transform:translateY(-45vh) translateX(12px) rotate(7deg) scale(1);opacity:.95;}
      85%{opacity:.45;}
      100%{transform:translateY(-105vh) translateX(-8px) rotate(-6deg) scale(.9);opacity:0;}
    }

    .floating-stars{
      position:absolute; inset:0;
      z-index:9;
      pointer-events:none;
      overflow:hidden;
    }
    .floating-stars span{
      position:absolute;
      color:#fff4a3;
      font-size:18px;
      opacity:0;
      filter:drop-shadow(0 0 5px rgba(255,244,163,.65)) drop-shadow(0 0 12px rgba(255,244,163,.30));
      animation:starTwinkle 4.2s ease-in-out infinite;
    }
    .floating-stars span:nth-child(1){top:24%;left:10%;font-size:18px;animation-delay:0s;}
    .floating-stars span:nth-child(2){top:28%;right:14%;font-size:23px;animation-delay:.6s;}
    .floating-stars span:nth-child(3){top:48%;left:5%;font-size:15px;animation-delay:1.1s;}
    .floating-stars span:nth-child(4){top:58%;right:7%;font-size:19px;animation-delay:1.7s;}
    .floating-stars span:nth-child(5){bottom:28%;left:14%;font-size:21px;animation-delay:2.2s;}
    .floating-stars span:nth-child(6){bottom:23%;right:12%;font-size:16px;animation-delay:.9s;}
    @keyframes starTwinkle{
      0%{opacity:0;transform:scale(.55) rotate(0deg);}
      20%{opacity:.25;transform:scale(.8) rotate(6deg);}
      42%{opacity:1;transform:scale(1.25) rotate(15deg);}
      58%{opacity:.9;transform:scale(1.05) rotate(8deg);}
      72%{opacity:.35;transform:scale(.8) rotate(-4deg);}
      100%{opacity:0;transform:scale(.55) rotate(0deg);}
    }

    /* ===== TOP BAR ===== */
    .top-bar{
      position:absolute;
      top:0; left:0; right:0;
      z-index:30;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:22px 6vw;
    }
    .brand{
      display:flex; align-items:center; gap:8px;
      font-family:'Baloo 2',sans-serif;
      font-size:1.3rem;
      font-weight:700;
    }
    .brand span{color:var(--pink-deep);}
    .back-btn{
      border:1px solid rgba(74,53,64,.12);
      background:rgba(255,255,255,.68);
      backdrop-filter:blur(10px);
      padding:9px 18px;
      border-radius:999px;
      color:var(--plum);
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(74,53,64,.06);
      transition:transform .25s ease, background .25s ease;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .back-btn:hover{background:var(--white);transform:translateY(-2px);}
    .back-arrow{display:inline-block;transition:transform .25s ease;}
    html[dir="rtl"] .back-arrow{transform:scaleX(-1);}

    /* ===== POLAROID ===== */
    .polaroid-pos{
      position:absolute;
      left:50%;
      top:11%;
      transform:translateX(-50%);
      width:min(410px, 84vw);
      z-index:6;
    }
    .polaroid{
      position:relative;
      background:var(--white);
      padding:14px 14px 16px;
      border-radius:10px;
      box-shadow:0 24px 55px rgba(74,53,64,.20);
      transform:rotate(-2deg);
      transform-origin:bottom center;
    }
    /* washi tape على الزوايا */
    .polaroid::before,
    .polaroid::after{
      content:'';
      position:absolute;
      width:74px; height:24px;
      background:rgba(244,169,197,.5);
      border-left:2px dashed rgba(255,255,255,.85);
      border-right:2px dashed rgba(255,255,255,.85);
      border-radius:3px;
      top:-12px;
    }
    .polaroid::before{left:-24px;transform:rotate(-38deg);}
    .polaroid::after{right:-24px;transform:rotate(38deg);}

    .polaroid.eject{
      animation:polaroidEject .75s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes polaroidEject{
      0%{transform:translateY(150px) scale(.55) rotate(8deg);opacity:0;}
      55%{transform:translateY(-16px) scale(1.04) rotate(-4deg);opacity:1;}
      100%{transform:translateY(0) scale(1) rotate(-2deg);opacity:1;}
    }

    .polaroid-img-wrap{
      position:relative;
      background:var(--cream-deep);
      border-radius:6px;
      overflow:hidden;
      aspect-ratio:4/3;
    }
    .portfolio-image{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transition:opacity .3s ease;
    }
    .slide-label{
      position:absolute;
      left:12px; top:12px;
      padding:7px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(74,53,64,.08);
      backdrop-filter:blur(8px);
      color:var(--plum);
      font-size:.72rem;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      box-shadow:0 8px 18px rgba(74,53,64,.07);
    }
    html[dir="rtl"] .slide-label{left:auto;right:12px;}

    .polaroid-caption{
      font-family:'Caveat', cursive;
      font-size:1.5rem;
      font-weight:600;
      text-align:center;
      padding-top:10px;
      color:var(--plum-soft);
      min-height:2.2rem;
    }

    /* ===== CAPYBARA PHOTOGRAPHER ===== */
    .capy-photographer{
      position:absolute;
      left:50%;
      bottom:88px;
      transform:translateX(-50%);
      width:min(300px, 62vw);
      z-index:5;
      pointer-events:none;
      animation:capyBob 4s ease-in-out infinite;
    }
    @keyframes capyBob{
      0%,100%{transform:translateX(-50%) translateY(0);}
      50%{transform:translateX(-50%) translateY(-6px);}
    }
    .capy-photographer svg{
      display:block;
      width:100%;
      height:auto;
      filter:drop-shadow(0 10px 16px rgba(74,53,64,.12));
    }
    .capy-photographer .flash{
      opacity:0;
      transform-box:fill-box;
      transform-origin:center;
    }
    .capy-photographer .camera{
      transform-box:fill-box;
      transform-origin:center;
    }
    .capy-photographer.shooting .flash{
      animation:flashBurst .55s ease;
    }
    .capy-photographer.shooting .camera{
      animation:camShake .45s ease;
    }
    @keyframes flashBurst{
      0%{opacity:0;transform:scale(.5);}
      40%{opacity:1;transform:scale(1.2);}
      100%{opacity:0;transform:scale(1);}
    }
    @keyframes camShake{
      0%,100%{transform:translateY(0) rotate(0);}
      30%{transform:translateY(3px) rotate(-2deg);}
      60%{transform:translateY(-2px) rotate(2deg);}
    }

    /* ===== CONTROLS ===== */
    .controls{
      position:absolute;
      z-index:40;
      left:6vw; right:6vw;
      bottom:22px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:18px;
    }
    .arrow-group{display:flex;gap:10px;}
    .arrow{
      width:44px; height:44px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.82);
      color:var(--plum);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.15rem;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(74,53,64,.08);
      transition:transform .2s ease, background .2s ease;
    }
    .arrow:hover{background:var(--white);transform:translateY(-2px);}
    .dots{display:flex;gap:7px;justify-content:center;align-items:center;}
    .dot{
      width:7px; height:7px;
      border-radius:50%;
      border:none;
      background:rgba(74,53,64,.2);
      padding:0;
      cursor:pointer;
      transition:width .3s ease, background .3s ease;
    }
    .dot.active{width:24px;border-radius:999px;background:var(--pink-deep);}
    .counter{
      justify-self:end;
      padding:8px 13px;
      border-radius:999px;
      background:rgba(255,255,255,.7);
      color:var(--plum-soft);
      font-size:.78rem;
      font-weight:700;
      border:1px solid rgba(74,53,64,.08);
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width:800px){
      .top-bar{padding:18px 5vw;}
      .brand{font-size:1.1rem;}
      .back-btn{padding:8px 14px;font-size:.85rem;}
      .polaroid-pos{top:9%;width:min(360px,86vw);}
      .capy-photographer{width:min(240px,60vw);bottom:92px;}
      .controls{left:5vw;right:5vw;bottom:16px;}
      .arrow{width:40px;height:40px;}
    }
    @media(max-width:520px){
      .polaroid-pos{top:8%;}
      .polaroid-caption{font-size:1.25rem;}
      .counter{display:none;}
      .controls{grid-template-columns:1fr 1fr;}
      .dots{grid-column:1 / -1;grid-row:1;}
      .arrow-group{grid-column:1 / -1;grid-row:2;justify-content:space-between;}
      .capy-photographer{width:220px;bottom:96px;}
    }

    /* ===== MORPH TRANSITION ===== */
    .page-transition{
      position:fixed; inset:0;
      z-index:9999;
      background:var(--cream);
      display:flex;
      justify-content:center;
      align-items:center;
      pointer-events:none;
      opacity:0;
      transform:scale(1.08);
      border-radius:45%;
      transition:opacity .45s ease, transform .65s cubic-bezier(.7,0,.2,1), border-radius .65s ease;
      backdrop-filter:blur(0);
    }
    .page-transition.active{
      opacity:1;
      transform:scale(1);
      border-radius:0;
      pointer-events:auto;
      backdrop-filter:blur(10px);
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
      .arrow,.back-btn,.portfolio-image{transition:none;}
    }
  </style>
</head>

<body>

  <div class="page-transition active" id="pageTransition"></div>

  <main class="portfolio-page">

    <div class="background-blob"></div>
    <div class="background-blob two"></div>

    <!-- ===== حبل الصور المعلقة ===== -->
    <svg class="garland" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0 26 Q300 108 600 38" stroke="#D9B8A6" stroke-width="3" fill="none"/>
      <path d="M600 38 Q900 112 1200 28" stroke="#D9B8A6" stroke-width="3" fill="none"/>
      <!-- صور صغيرة معلقة -->
      <g transform="rotate(-4 150 92)">
        <line x1="150" y1="62" x2="150" y2="80" stroke="#B9855A" stroke-width="2"/>
        <rect x="126" y="80" width="48" height="56" rx="4" fill="#fff"/>
        <rect x="131" y="85" width="38" height="38" rx="3" fill="#FCE0EB"/>
      </g>
      <g transform="rotate(3 300 106)">
        <line x1="300" y1="78" x2="300" y2="96" stroke="#B9855A" stroke-width="2"/>
        <rect x="276" y="96" width="48" height="56" rx="4" fill="#fff"/>
        <rect x="281" y="101" width="38" height="38" rx="3" fill="#E4EFDF"/>
      </g>
      <g transform="rotate(-3 450 88)">
        <line x1="450" y1="60" x2="450" y2="78" stroke="#B9855A" stroke-width="2"/>
        <rect x="426" y="78" width="48" height="56" rx="4" fill="#fff"/>
        <rect x="431" y="83" width="38" height="38" rx="3" fill="#FFE9D6"/>
      </g>
      <g transform="rotate(4 750 92)">
        <line x1="750" y1="64" x2="750" y2="82" stroke="#B9855A" stroke-width="2"/>
        <rect x="726" y="82" width="48" height="56" rx="4" fill="#fff"/>
        <rect x="731" y="87" width="38" height="38" rx="3" fill="#E4EFF9"/>
      </g>
      <g transform="rotate(-3 900 104)">
        <line x1="900" y1="76" x2="900" y2="94" stroke="#B9855A" stroke-width="2"/>
        <rect x="876" y="94" width="48" height="56" rx="4" fill="#fff"/>
        <rect x="881" y="99" width="38" height="38" rx="3" fill="#FCE0EB"/>
      </g>
      <g transform="rotate(4 1050 78)">
        <line x1="1050" y1="50" x2="1050" y2="68" stroke="#B9855A" stroke-width="2"/>
        <rect x="1026" y="68" width="48" height="56" rx="4" fill="#fff"/>
        <rect x="1031" y="73" width="38" height="38" rx="3" fill="#E4EFDF"/>
      </g>
    </svg>

    <div class="floating-hearts" aria-hidden="true">
      <span>🩷</span><span>💗</span><span>💕</span>
      <span>🩷</span><span>💗</span><span>♡</span>
    </div>

    <div class="floating-stars" aria-hidden="true">
      <span>✦</span><span>✧</span><span>✦</span>
      <span>✧</span><span>✦</span><span>✧</span>
    </div>

    <!-- ===== TOP BAR ===== -->
    <header class="top-bar">
      <div class="brand">Capibara <span>Designs</span></div>
      <button class="back-btn" type="button" id="backBtn" aria-label="Retour au site principal">
        <span class="back-arrow" aria-hidden="true">←</span>
        <span data-i18n="back">Retour</span>
      </button>
    </header>

    <!-- ===== POLAROID ===== -->
    <div class="polaroid-pos">
      <figure class="polaroid" id="polaroid">
        <div class="polaroid-img-wrap">
          <img class="portfolio-image" id="portfolioImage" src="portfolio/1.png" alt="Mon travail créatif — Capibara Designs">
          <div class="slide-label" id="slideLabel">Mon travail créatif</div>
        </div>
        <figcaption class="polaroid-caption" id="polaroidCaption">Mon travail créatif ♡</figcaption>
      </figure>
    </div>

    <!-- ===== CAPYBARA PHOTOGRAPHER ===== -->
    <div class="capy-photographer" id="capyPhotographer" aria-hidden="true">
      <svg viewBox="0 0 360 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- ظل -->
        <ellipse cx="180" cy="304" rx="112" ry="13" fill="#E4EFDF"/>
        <!-- الأذنين -->
        <circle cx="110" cy="70" r="24" fill="#C77F68" stroke="#6E2E38" stroke-width="6"/>
        <circle cx="250" cy="70" r="24" fill="#C77F68" stroke="#6E2E38" stroke-width="6"/>
        <circle cx="110" cy="70" r="11" fill="#E8A28E"/>
        <circle cx="250" cy="70" r="11" fill="#E8A28E"/>
        <!-- الجسم -->
        <ellipse cx="180" cy="225" rx="100" ry="85" fill="#E99A78" stroke="#6E2E38" stroke-width="7"/>
        <ellipse cx="180" cy="248" rx="68" ry="55" fill="#F0B294"/>
        <!-- الرأس -->
        <ellipse cx="180" cy="120" rx="82" ry="72" fill="#ED9D7C" stroke="#6E2E38" stroke-width="7"/>
        <!-- عيون سعيدة -->
        <path d="M138 112 q9 -11 18 0" stroke="#632332" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M204 112 q9 -11 18 0" stroke="#632332" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- الخدود -->
        <ellipse cx="118" cy="140" rx="15" ry="9" fill="#F47F75" opacity=".7"/>
        <ellipse cx="242" cy="140" rx="15" ry="9" fill="#F47F75" opacity=".7"/>
        <!-- الأنف والفم -->
        <ellipse cx="180" cy="140" rx="24" ry="17" fill="#C87561"/>
        <ellipse cx="171" cy="136" rx="4" ry="3.5" fill="#632332"/>
        <ellipse cx="189" cy="136" rx="4" ry="3.5" fill="#632332"/>
        <path d="M180 144 Q180 153 171 158" stroke="#632332" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M180 144 Q180 153 189 158" stroke="#632332" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- فلاش التصوير -->
        <g class="flash">
          <path d="M180 186 L180 170" stroke="#FFD9B8" stroke-width="6" stroke-linecap="round"/>
          <path d="M156 192 L144 180" stroke="#FFD9B8" stroke-width="6" stroke-linecap="round"/>
          <path d="M204 192 L216 180" stroke="#FFD9B8" stroke-width="6" stroke-linecap="round"/>
        </g>
        <!-- الكاميرا -->
        <g class="camera">
          <rect x="128" y="200" width="104" height="72" rx="14" fill="#F4A9C5" stroke="#6E2E38" stroke-width="6"/>
          <rect x="128" y="200" width="104" height="20" rx="10" fill="#FCE0EB" stroke="#6E2E38" stroke-width="5"/>
          <circle cx="180" cy="242" r="20" fill="#FFF6EF" stroke="#6E2E38" stroke-width="6"/>
          <circle cx="180" cy="242" r="10" fill="#A9C6E8" stroke="#6E2E38" stroke-width="4"/>
          <circle cx="176" cy="238" r="3" fill="#fff"/>
          <rect x="208" y="206" width="14" height="9" rx="3" fill="#FFD9B8" stroke="#6E2E38" stroke-width="3"/>
          <circle cx="146" cy="211" r="5" fill="#E88AAE" stroke="#6E2E38" stroke-width="3"/>
        </g>
        <!-- اليدين فوق الكاميرا -->
        <ellipse cx="126" cy="222" rx="24" ry="16" fill="#C87561" transform="rotate(-24 126 222)"/>
        <ellipse cx="234" cy="222" rx="24" ry="16" fill="#C87561" transform="rotate(24 234 222)"/>
      </svg>
    </div>

    <!-- ===== NAVIGATION ===== -->
    <div class="controls">
      <div class="arrow-group">
        <button class="arrow" id="prevBtn" type="button" aria-label="Slide précédente">←</button>
        <button class="arrow" id="nextBtn" type="button" aria-label="Slide suivante">→</button>
      </div>
      <div class="dots" id="dots" aria-label="Navigation des slides"></div>
      <div class="counter" id="counter" aria-live="polite">01 / 05</div>
    </div>

  </main>

  <script>
    /* ===== TRADUCTIONS i18n ===== */
    const translations = {
      fr: {
        back:'Retour', backAria:'Retour au site principal',
        label1:'Mon travail créatif', label2:'Moodboard', label3:'Logos',
        label4:'Présentations PowerPoint', label5:'Cartes de visite',
        prevAria:'Slide précédente', nextAria:'Slide suivante',
        dotsAria:'Navigation des slides',
        dotAria:(i)=>`Aller à la slide ${i}`,
        title:'Portfolio — Capibara Designs', direction:'ltr'
      },
      en: {
        back:'Back', backAria:'Return to main site',
        label1:'My Creative Work', label2:'Moodboard', label3:'Logos',
        label4:'PowerPoint Presentations', label5:'Business Cards',
        prevAria:'Previous slide', nextAria:'Next slide',
        dotsAria:'Slide navigation',
        dotAria:(i)=>`Go to slide ${i}`,
        title:'Portfolio — Capibara Designs', direction:'ltr'
      },
      ar: {
        back:'رجوع', backAria:'العودة إلى الموقع الرئيسي',
        label1:'أعمالي الإبداعية', label2:'لوحة الإلهام', label3:'الشعارات',
        label4:'عروض PowerPoint', label5:'بطاقات العمل',
        prevAria:'الشريحة السابقة', nextAria:'الشريحة التالية',
        dotsAria:'التنقل بين الشرائح',
        dotAria:(i)=>`انتقل إلى الشريحة ${i}`,
        title:'الأعمال — كابيبارا ديزاينز', direction:'rtl'
      }
    };

    let currentLang = localStorage.getItem('capibara-lang') || 'fr';

    /* ===== الأعمال ===== */
    const works = [
      { src:'portfolio/1.png', key:'label1' },
      { src:'portfolio/2.png', key:'label2' },
      { src:'portfolio/3.png', key:'label3' },
      { src:'portfolio/4.png', key:'label4' },
      { src:'portfolio/5.png', key:'label5' }
    ];

    const slidesCount = works.length;
    const polaroid = document.getElementById('polaroid');
    const portfolioImage = document.getElementById('portfolioImage');
    const slideLabel = document.getElementById('slideLabel');
    const polaroidCaption = document.getElementById('polaroidCaption');
    const capyPhotographer = document.getElementById('capyPhotographer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');

    let currentSlide = 0;

    /* ===== CREATE DOTS ===== */
    works.forEach((work, index) => {
      const dot = document.createElement('button');
      dot.className = 'dot';
      dot.type = 'button';
      dot.setAttribute('aria-label', translations[currentLang].dotAria(index + 1));
      if(index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => showSlide(index));
      dotsContainer.appendChild(dot);
    });
    const dots = document.querySelectorAll('.dot');

    /* ===== تحديث النصوص ===== */
    function updateTexts(){
      const t = translations[currentLang];
      const work = works[currentSlide];
      const text = t[work.key];
      slideLabel.textContent = text;
      polaroidCaption.textContent = text + ' ♡';
      portfolioImage.alt = text + ' — Capibara Designs';
    }

    /* ===== APPLY LANGUAGE ===== */
    function applyLanguage(lang){
      currentLang = lang;
      localStorage.setItem('capibara-lang', lang);
      const t = translations[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = t.direction;
      document.title = t.title;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if(t[key]) el.textContent = t[key];
      });

      document.getElementById('backBtn').setAttribute('aria-label', t.backAria);
      prevBtn.setAttribute('aria-label', t.prevAria);
      nextBtn.setAttribute('aria-label', t.nextAria);
      dotsContainer.setAttribute('aria-label', t.dotsAria);
      dots.forEach((dot, i) => dot.setAttribute('aria-label', t.dotAria(i + 1)));

      updateTexts();
    }

    /* ===== SHOW SLIDE ===== */
    function showSlide(index){
      if(index < 0) index = slidesCount - 1;
      if(index >= slidesCount) index = 0;

      currentSlide = index;

      /* الكاميرا كتصوّر 🔊 */
      capyPhotographer.classList.remove('shooting');
      void capyPhotographer.offsetWidth;
      capyPhotographer.classList.add('shooting');

      /* الـ Polaroid كيطلع من الكاميرا */
      polaroid.classList.remove('eject');
      void polaroid.offsetWidth;
      polaroid.classList.add('eject');

      /* تبديل الصورة */
      portfolioImage.style.opacity = 0;
      const pre = new Image();
      pre.src = works[index].src;
      pre.onload = () => {
        portfolioImage.src = works[index].src;
        portfolioImage.style.opacity = 1;
      };

      updateTexts();

      dots.forEach(d => d.classList.remove('active'));
      dots[index].classList.add('active');

      counter.textContent =
        String(index + 1).padStart(2,'0') + ' / ' + String(slidesCount).padStart(2,'0');
    }

    /* ===== BUTTONS ===== */
    nextBtn.addEventListener('click', () => showSlide(currentSlide + 1));
    prevBtn.addEventListener('click', () => showSlide(currentSlide - 1));
    document.getElementById('backBtn').addEventListener('click', goBack);

    /* ===== KEYBOARD ===== */
    document.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowRight') showSlide(currentSlide + 1);
      if(e.key === 'ArrowLeft') showSlide(currentSlide - 1);
      if(e.key === 'Escape') goBack();
    });

    /* ===== TOUCH / SWIPE ===== */
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive:true });
    document.addEventListener('touchend', (e) => {
      const distance = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(distance) < 50) return;
      if(distance < 0) showSlide(currentSlide + 1);
      else showSlide(currentSlide - 1);
    }, { passive:true });

    /* ===== MORPH TRANSITION ===== */
    const pageTransition = document.getElementById('pageTransition');

    window.addEventListener('load', () => {
      applyLanguage(currentLang);
      requestAnimationFrame(() => {
        pageTransition.classList.remove('active');
      });
      /* أول Polaroid كيطلع بوحدها */
      setTimeout(() => {
        polaroid.classList.add('eject');
        capyPhotographer.classList.add('shooting');
      }, 350);
    });

    /* ===== RETURN ===== */
    function goBack(){
      pageTransition.classList.add('active');
      setTimeout(() => {
        window.location.href = 'index.html#portfolio';
      }, 550);
    }
  </script>

</body>
</html>
