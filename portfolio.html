<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Capibara Designs</title>
  <meta name="description" content="Découvrez le portfolio de Capibara Designs dans le journal créatif : logos, moodboards, présentations PowerPoint et cartes de visite.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Capibara Designs">
  <meta property="og:title" content="Portfolio — Capibara Designs">
  <meta property="og:description" content="Journal créatif de Capibara Designs : logos, moodboards, présentations PowerPoint et cartes de visite.">
  <meta property="og:image" content="https://capibara-designs.github.io/capibara-designs/logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --cream:#FFF6EF; --cream-deep:#FBEBDD;
      --pink:#F4A9C5; --pink-soft:#FCE0EB; --pink-deep:#E88AAE;
      --sage:#A9C9A4; --sage-deep:#7FA876; --sage-soft:#E4EFDF;
      --plum:#4A3540; --plum-soft:#8B7580;
      --peach:#FFD9B8; --white:#FFFFFF;
      --paper:#FFFCF8;
      --shadow:0 15px 40px rgba(74,53,64,.12);
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{width:100%; height:100%; overflow:hidden;}
    body{font-family:'Quicksand',sans-serif; background:var(--cream); color:var(--plum);}
    button,a{font:inherit;}

    /* ===== PAGE ===== */
    .portfolio-page{
      width:100%; height:100vh;
      position:relative; overflow:hidden; isolation:isolate;
      background:
        linear-gradient(rgba(255,246,239,.9), rgba(255,246,239,.9)),
        url("logo.png") center center / cover no-repeat;
    }

    /* ===== BACKGROUND GLOW ===== */
    .background-blob{
      position:absolute; width:580px; height:580px; border-radius:50%;
      background:radial-gradient(circle, rgba(244,169,197,.38) 0%, rgba(244,169,197,.15) 38%, transparent 72%);
      filter:blur(18px); opacity:.72;
      top:-240px; right:-170px;
      pointer-events:none; z-index:0;
      animation:ambientGlow 6s ease-in-out infinite;
    }
    .background-blob.two{
      width:500px; height:500px;
      background:radial-gradient(circle, rgba(169,201,164,.32) 0%, rgba(169,201,164,.13) 38%, transparent 72%);
      top:auto; right:auto; bottom:-240px; left:-170px;
      animation:ambientGlow 7s ease-in-out infinite reverse;
    }
    @keyframes ambientGlow{0%,100%{transform:scale(1);opacity:.68;}50%{transform:scale(1.08);opacity:.95;}}

    /* ===== FLOATING HEARTS & STARS ===== */
    .floating-hearts{position:absolute; inset:0; z-index:8; pointer-events:none; overflow:hidden;}
    .floating-hearts span{
      position:absolute; bottom:-40px; font-size:18px; opacity:0;
      filter:drop-shadow(0 4px 8px rgba(232,138,174,.16));
      animation:heartFloat 7s linear infinite;
    }
    .floating-hearts span:nth-child(1){left:12%;animation-delay:0s;animation-duration:7.5s;}
    .floating-hearts span:nth-child(2){left:28%;animation-delay:2.2s;animation-duration:8.5s;font-size:14px;}
    .floating-hearts span:nth-child(3){left:47%;animation-delay:4s;animation-duration:7s;font-size:20px;}
    .floating-hearts span:nth-child(4){left:68%;animation-delay:1.2s;animation-duration:9s;font-size:15px;}
    .floating-hearts span:nth-child(5){left:84%;animation-delay:3s;animation-duration:7.8s;font-size:21px;}
    .floating-hearts span:nth-child(6){left:92%;animation-delay:5s;animation-duration:8.8s;font-size:13px;}
    @keyframes heartFloat{
      0%{transform:translateY(0) translateX(0) rotate(-8deg) scale(.8);opacity:0;}
      12%{opacity:.7;}
      50%{transform:translateY(-45vh) translateX(12px) rotate(7deg) scale(1);opacity:.95;}
      85%{opacity:.45;}
      100%{transform:translateY(-105vh) translateX(-8px) rotate(-6deg) scale(.9);opacity:0;}
    }

    .floating-stars{position:absolute; inset:0; z-index:9; pointer-events:none; overflow:hidden;}
    .floating-stars span{
      position:absolute; color:#fff4a3; font-size:22px; opacity:0;
      filter:drop-shadow(0 0 5px rgba(255,244,163,.65)) drop-shadow(0 0 12px rgba(255,244,163,.30));
      animation:starTwinkle 4.2s ease-in-out infinite;
    }
    .floating-stars span:nth-child(1){top:14%;left:10%;font-size:22px;animation-delay:0s;}
    .floating-stars span:nth-child(2){top:20%;right:14%;font-size:28px;animation-delay:.6s;}
    .floating-stars span:nth-child(3){top:48%;left:5%;font-size:20px;animation-delay:1.1s;}
    .floating-stars span:nth-child(4){top:58%;right:7%;font-size:24px;animation-delay:1.7s;}
    .floating-stars span:nth-child(5){bottom:18%;left:14%;font-size:26px;animation-delay:2.2s;}
    .floating-stars span:nth-child(6){bottom:13%;right:12%;font-size:22px;animation-delay:.9s;}
    @keyframes starTwinkle{
      0%{opacity:0;transform:scale(.55) rotate(0deg);}
      20%{opacity:.35;transform:scale(.85) rotate(6deg);}
      50%{opacity:1;transform:scale(1.25) rotate(15deg);}
      70%{opacity:.6;transform:scale(1.05) rotate(8deg);}
      100%{opacity:0;transform:scale(.55) rotate(0deg);}
    }

    /* ===== TOP BAR ===== */
    .top-bar{
      position:absolute; top:0; left:0; right:0; z-index:30;
      display:flex; justify-content:space-between; align-items:center;
      padding:22px 6vw;
    }
    .brand{
      display:flex; align-items:center; gap:8px;
      font-family:'Baloo 2',sans-serif; font-size:1.3rem; font-weight:700;
    }
    .brand span{color:var(--pink-deep);}
    .back-btn{
      border:1px solid rgba(74,53,64,.12);
      background:rgba(255,255,255,.68); backdrop-filter:blur(10px);
      padding:9px 18px; border-radius:999px;
      color:var(--plum); font-weight:700; cursor:pointer;
      box-shadow:0 8px 20px rgba(74,53,64,.06);
      transition:transform .25s ease, background .25s ease;
      display:inline-flex; align-items:center; gap:6px;
    }
    .back-btn:hover{background:var(--white); transform:translateY(-2px);}
    .back-arrow{display:inline-block; transition:transform .25s ease;}
    html[dir="rtl"] .back-arrow{transform:scaleX(-1);}

    /* ===== DIARY FRAME ===== */
    .diary-wrapper{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      padding:88px 5vw 110px;
      z-index:5;
    }
    .diary-container{
      position:relative;
      display:flex;
      align-items:center;
      gap:24px;
      max-width:1100px;
      width:100%;
    }

    /* الورقة الرئيسية */
    .diary-page{
      position:relative;
      flex:1;
      aspect-ratio:16/10;
      max-width:780px;
      background:var(--paper);
      border-radius:4px 14px 14px 4px;
      box-shadow:
        0 30px 60px rgba(74,53,64,.18),
        0 10px 20px rgba(74,53,64,.08),
        inset 0 0 80px rgba(244,169,197,.05);
      padding:54px 48px 36px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    html[dir="rtl"] .diary-page{
      border-radius:14px 4px 4px 14px;
    }

    /* خط الورقة المسطّر */
    .diary-page::before{
      content:'';
      position:absolute; inset:0;
      background-image:repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 31px,
        rgba(232,138,174,.12) 31px,
        rgba(232,138,174,.12) 32px
      );
      pointer-events:none;
      border-radius:inherit;
    }
    /* خط الهامش الأحمر */
    .diary-page::after{
      content:'';
      position:absolute;
      top:0; bottom:0;
      left:60px;
      width:1px;
      background:rgba(244,127,117,.35);
      pointer-events:none;
    }
    html[dir="rtl"] .diary-page::after{
      left:auto; right:60px;
    }

    /* Spiral binding في الأعلى */
    .spiral{
      position:absolute;
      top:-6px; left:0; right:0;
      display:flex;
      justify-content:space-evenly;
      z-index:3;
      pointer-events:none;
    }
    .spiral span{
      width:18px; height:26px;
      border:2.5px solid var(--plum-soft);
      border-radius:50%;
      background:var(--paper);
      box-shadow:0 2px 4px rgba(74,53,64,.15);
    }

    /* Washi tape على الزوايا */
    .tape{
      position:absolute;
      width:78px; height:22px;
      background:rgba(244,169,197,.55);
      border-left:2px dashed rgba(255,255,255,.85);
      border-right:2px dashed rgba(255,255,255,.85);
      border-radius:3px;
      z-index:4;
      box-shadow:0 4px 8px rgba(74,53,64,.1);
    }
    .tape.t1{top:14px; left:-18px; transform:rotate(-28deg); background:rgba(244,169,197,.6);}
    .tape.t2{top:14px; right:-18px; transform:rotate(28deg); background:rgba(169,201,164,.55);}
    .tape.t3{bottom:14px; left:-18px; transform:rotate(28deg); background:rgba(255,217,184,.7);}
    .tape.t4{bottom:14px; right:-18px; transform:rotate(-28deg); background:rgba(244,169,197,.6);}

    /* رأس الصفحة (التاريخ + العنوان) */
    .diary-header{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      margin-bottom:18px;
      padding-bottom:10px;
      border-bottom:2px dashed rgba(139,117,128,.2);
    }
    .diary-date{
      font-family:'Caveat', cursive;
      font-size:1.4rem;
      font-weight:600;
      color:var(--pink-deep);
      transform:rotate(-2deg);
    }
    .diary-title{
      font-family:'Caveat', cursive;
      font-size:1.6rem;
      font-weight:700;
      color:var(--plum);
      transform:rotate(1deg);
    }

    /* منطقة المحتوى */
    .diary-content{
      position:relative;
      z-index:2;
      flex:1;
      display:grid;
      grid-template-columns:1fr 1.5fr;
      gap:20px;
      align-items:center;
    }
    html[dir="rtl"] .diary-content{
      grid-template-columns:1.5fr 1fr;
    }

    /* تعليق بخط اليد */
    .diary-note{
      position:relative;
      font-family:'Caveat', cursive;
      font-size:1.25rem;
      line-height:1.4;
      color:var(--plum);
      font-weight:500;
      min-height:120px;
    }
    .diary-note::before{
      content:'✎';
      position:absolute;
      top:-14px;
      left:-4px;
      font-size:1.2rem;
      color:var(--pink-deep);
    }
    html[dir="rtl"] .diary-note::before{
      left:auto; right:-4px;
      transform:scaleX(-1);
    }
    .diary-note .note-emoji{
      display:inline-block;
      margin-left:4px;
      animation:emojiBounce 2.2s ease-in-out infinite;
    }
    html[dir="rtl"] .diary-note .note-emoji{
      margin-left:0; margin-right:4px;
    }
    @keyframes emojiBounce{
      0%,100%{transform:translateY(0) rotate(-5deg);}
      50%{transform:translateY(-4px) rotate(8deg);}
    }

    /* إطار الصورة */
    .diary-image-wrap{
      position:relative;
      width:100%;
      aspect-ratio:4/3;
      background:var(--cream);
      border-radius:10px;
      border:3px solid var(--white);
      box-shadow:
        0 8px 20px rgba(74,53,64,.15),
        inset 0 0 0 1px rgba(74,53,64,.04);
      overflow:hidden;
      transform:rotate(-1.5deg);
      transition:transform .4s ease;
    }
    .diary-image-wrap:hover{
      transform:rotate(0deg) scale(1.02);
    }
    .portfolio-image{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:contain;
      object-position:center;
      opacity:1;
      transition:opacity .4s ease;
    }
    .portfolio-image.fading{
      opacity:0;
    }
    .slide-label{
      position:absolute;
      left:10px; top:10px;
      padding:5px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(74,53,64,.08);
      backdrop-filter:blur(8px);
      color:var(--plum);
      font-size:.68rem;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      box-shadow:0 4px 10px rgba(74,53,64,.07);
      z-index:2;
    }
    html[dir="rtl"] .slide-label{left:auto; right:10px;}

    /* تذييل الصفحة (رقم الصفحة) */
    .diary-footer{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:center;
      margin-top:12px;
      font-family:'Caveat', cursive;
      font-size:1.1rem;
      color:var(--plum-soft);
      font-weight:600;
    }

    /* doodles حول المفكرة */
    .doodles{
      position:absolute; inset:0;
      pointer-events:none;
      z-index:1;
    }
    .doodle{
      position:absolute;
      opacity:.85;
      filter:drop-shadow(0 2px 4px rgba(74,53,64,.1));
    }
    .doodle.d1{top:-18px; right:8%; transform:rotate(18deg); animation:doodleFloat 4s ease-in-out infinite;}
    .doodle.d2{top:18%; left:-20px; transform:rotate(-15deg); animation:doodleFloat 5s ease-in-out infinite .5s;}
    .doodle.d3{bottom:8%; right:-10px; transform:rotate(12deg); animation:doodleFloat 4.5s ease-in-out infinite 1s;}
    .doodle.d4{bottom:-10px; left:12%; transform:rotate(-8deg); animation:doodleFloat 5.5s ease-in-out infinite 1.5s;}
    @keyframes doodleFloat{
      0%,100%{transform:translateY(0) rotate(var(--r,0deg));}
      50%{transform:translateY(-6px) rotate(var(--r,0deg));}
    }
    .d1{--r:18deg;} .d2{--r:-15deg;} .d3{--r:12deg;} .d4{--r:-8deg;}

    /* ===== CAPYBARA READER ===== */
    .capy-reader{
      flex-shrink:0;
      width:160px;
      height:200px;
      animation:capyBob 4s ease-in-out infinite;
      filter:drop-shadow(0 12px 18px rgba(74,53,64,.15));
    }
    @keyframes capyBob{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-8px);}
    }
    .capy-reader svg{
      width:100%; height:100%;
      display:block;
    }
    .capy-reader .book{
      transform-box:fill-box;
      transform-origin:center;
      animation:bookWiggle 3s ease-in-out infinite;
    }
    @keyframes bookWiggle{
      0%,100%{transform:rotate(-2deg);}
      50%{transform:rotate(2deg);}
    }

    /* ===== CONTROLS ===== */
    .controls{
      position:absolute;
      z-index:40;
      left:6vw; right:6vw;
      bottom:22px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:18px;
    }
    .arrow-group{display:flex; gap:10px;}
    .arrow{
      width:44px; height:44px;
      border:none; border-radius:50%;
      background:rgba(255,255,255,.82);
      color:var(--plum);
      display:flex; align-items:center; justify-content:center;
      font-size:1.15rem;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(74,53,64,.08);
      transition:transform .2s ease, background .2s ease;
    }
    .arrow:hover{background:var(--white); transform:translateY(-2px);}
    html[dir="rtl"] .arrow{transform:scaleX(-1);}
    html[dir="rtl"] .arrow:hover{transform:scaleX(-1) translateY(-2px);}
    .dots{display:flex; gap:7px; justify-content:center; align-items:center;}
    .dot{
      width:7px; height:7px; border-radius:50%;
      border:none; background:rgba(74,53,64,.2);
      padding:0; cursor:pointer;
      transition:width .3s ease, background .3s ease;
    }
    .dot.active{width:24px; border-radius:999px; background:var(--pink-deep);}
    .counter{
      justify-self:end;
      padding:8px 13px; border-radius:999px;
      background:rgba(255,255,255,.7);
      color:var(--plum-soft);
      font-size:.78rem; font-weight:700;
      border:1px solid rgba(74,53,64,.08);
    }

    /* ===== PAGE TRANSITION ===== */
    .page-transition{
      position:fixed; inset:0; z-index:9999;
      background:var(--cream);
      display:flex; justify-content:center; align-items:center;
      pointer-events:none;
      opacity:0; transform:scale(1.08);
      border-radius:45%;
      transition:opacity .45s ease, transform .65s cubic-bezier(.7,0,.2,1), border-radius .65s ease;
      backdrop-filter:blur(0);
    }
    .page-transition.active{
      opacity:1; transform:scale(1); border-radius:0;
      pointer-events:auto; backdrop-filter:blur(10px);
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width:900px){
      .diary-container{flex-direction:column; gap:16px;}
      .capy-reader{width:100px; height:130px; order:-1;}
      .diary-page{aspect-ratio:auto; min-height:440px;}
      .diary-content{grid-template-columns:1fr; gap:14px;}
      html[dir="rtl"] .diary-content{grid-template-columns:1fr;}
      .diary-note{min-height:auto;}
    }
    @media(max-width:800px){
      .top-bar{padding:18px 5vw;}
      .brand{font-size:1.1rem;}
      .back-btn{padding:8px 14px; font-size:.85rem;}
      .diary-wrapper{padding:78px 4vw 100px;}
      .diary-page{padding:42px 28px 28px;}
      .diary-date{font-size:1.15rem;}
      .diary-title{font-size:1.3rem;}
      .diary-note{font-size:1.05rem;}
      .controls{left:5vw; right:5vw; bottom:16px;}
      .arrow{width:40px; height:40px;}
    }
    @media(max-width:520px){
      .diary-page{padding:38px 18px 22px;}
      .diary-page::after{left:36px;}
      html[dir="rtl"] .diary-page::after{left:auto; right:36px;}
      .tape{width:60px; height:18px;}
      .tape.t1, .tape.t2{top:8px;}
      .tape.t3, .tape.t4{bottom:8px;}
      .counter{display:none;}
      .controls{grid-template-columns:1fr 1fr;}
      .dots{grid-column:1 / -1; grid-row:1;}
      .arrow-group{grid-column:1 / -1; grid-row:2; justify-content:space-between;}
      .doodles{display:none;}
      .capy-reader{width:80px; height:110px;}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="page-transition active" id="pageTransition"></div>

  <main class="portfolio-page">
    <div class="background-blob"></div>
    <div class="background-blob two"></div>

    <div class="floating-hearts" aria-hidden="true">
      <span>🩷</span><span>💗</span><span>💕</span>
      <span>🩷</span><span>💗</span><span>♡</span>
    </div>
    <div class="floating-stars" aria-hidden="true">
      <span>✦</span><span>✧</span><span>✦</span>
      <span>✧</span><span>✦</span><span>✧</span>
    </div>

    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="brand">Capibara <span>Designs</span></div>
      <button class="back-btn" type="button" id="backBtn" aria-label="Retour au site principal">
        <span class="back-arrow" aria-hidden="true">←</span>
        <span data-i18n="back">Retour</span>
      </button>
    </header>

    <!-- DIARY -->
    <div class="diary-wrapper">
      <div class="diary-container">

        <!-- Doodles -->
        <div class="doodles" aria-hidden="true">
          <!-- قلم رصاص -->
          <svg class="doodle d1" width="70" height="18" viewBox="0 0 70 18" fill="none">
            <rect x="10" y="4" width="50" height="10" rx="2" fill="#F4A9C5" stroke="#6E2E38" stroke-width="2"/>
            <polygon points="10,4 0,9 10,14" fill="#FFD9B8" stroke="#6E2E38" stroke-width="2"/>
            <rect x="55" y="4" width="12" height="10" fill="#FCE0EB" stroke="#6E2E38" stroke-width="2"/>
            <circle cx="3" cy="9" r="1.5" fill="#632332"/>
          </svg>
          <!-- قلب -->
          <svg class="doodle d2" width="42" height="40" viewBox="0 0 42 40" fill="none">
            <path d="M21 34 C 8 22, 2 14, 6 7 C 10 0, 18 2, 21 10 C 24 2, 32 0, 36 7 C 40 14, 34 22, 21 34 Z" fill="#FCE0EB" stroke="#E88AAE" stroke-width="2.5"/>
          </svg>
          <!-- نجمة -->
          <svg class="doodle d3" width="44" height="44" viewBox="0 0 44 44" fill="none">
            <path d="M22 4 L27 17 L41 17 L30 26 L34 40 L22 32 L10 40 L14 26 L3 17 L17 17 Z" fill="#FFE9D6" stroke="#D9B8A6" stroke-width="2"/>
          </svg>
          <!-- زهرة -->
          <svg class="doodle d4" width="42" height="42" viewBox="0 0 42 42" fill="none">
            <circle cx="21" cy="10" r="8" fill="#E4EFDF" stroke="#A9C9A4" stroke-width="2"/>
            <circle cx="10" cy="21" r="8" fill="#E4EFDF" stroke="#A9C9A4" stroke-width="2"/>
            <circle cx="32" cy="21" r="8" fill="#E4EFDF" stroke="#A9C9A4" stroke-width="2"/>
            <circle cx="21" cy="32" r="8" fill="#E4EFDF" stroke="#A9C9A4" stroke-width="2"/>

        </div>

        <!-- Capybara Reader -->
        <div class="capy-reader" aria-hidden="true">
          <svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- ظل -->
            <ellipse cx="100" cy="228" rx="60" ry="7" fill="rgba(74,53,64,.15)"/>
            <!-- الجسم (جالسة القرفصاء) -->
            <ellipse cx="100" cy="180" rx="58" ry="50" fill="#E99A78" stroke="#6E2E38" stroke-width="5"/>
            <ellipse cx="100" cy="195" rx="40" ry="30" fill="#F0B294"/>
            <!-- الأذنين -->
            <circle cx="60" cy="80" r="16" fill="#C77F68" stroke="#6E2E38" stroke-width="4"/>
            <circle cx="140" cy="80" r="16" fill="#C77F68" stroke="#6E2E38" stroke-width="4"/>
            <circle cx="60" cy="80" r="7" fill="#E8A28E"/>
            <circle cx="140" cy="80" r="7" fill="#E8A28E"/>
            <!-- الرأس -->
            <ellipse cx="100" cy="110" rx="55" ry="48" fill="#ED9D7C" stroke="#6E2E38" stroke-width="5"/>
            <!-- عيون كتقرا (منخفضة) -->
            <path d="M78 110 q6 -7 12 0" stroke="#632332" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M110 110 q6 -7 12 0" stroke="#632332" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <!-- الخدود -->
            <ellipse cx="68" cy="130" rx="10" ry="6" fill="#F47F75" opacity=".7"/>
            <ellipse cx="132" cy="130" rx="10" ry="6" fill="#F47F75" opacity=".7"/>
            <!-- الأنف والفم -->
            <ellipse cx="100" cy="130" rx="16" ry="11" fill="#C87561"/>
            <ellipse cx="95" cy="127" rx="2.5" ry="2" fill="#632332"/>
            <ellipse cx="105" cy="127" rx="2.5" ry="2" fill="#632332"/>
            <path d="M100 134 Q100 140 95 143" stroke="#632332" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M100 134 Q100 140 105 143" stroke="#632332" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- اليدين ماسكين الكتاب -->
            <ellipse cx="60" cy="185" rx="14" ry="10" fill="#C87561" transform="rotate(-20 60 185)"/>
            <ellipse cx="140" cy="185" rx="14" ry="10" fill="#C87561" transform="rotate(20 140 185)"/>
            <!-- الكتاب -->
            <g class="book">
              <rect x="50" y="165" width="50" height="40" rx="3" fill="#FFF6EF" stroke="#6E2E38" stroke-width="4"/>
              <rect x="100" y="165" width="50" height="40" rx="3" fill="#FFF6EF" stroke="#6E2E38" stroke-width="4"/>
              <line x1="100" y1="165" x2="100" y2="205" stroke="#6E2E38" stroke-width="3"/>
              <!-- سطور النص في الكتاب -->
              <line x1="58" y1="175" x2="85" y2="175" stroke="#F4A9C5" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="58" y1="182" x2="90" y2="182" stroke="#F4A9C5" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="58" y1="189" x2="80" y2="189" stroke="#F4A9C5" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="58" y1="196" x2="85" y2="196" stroke="#F4A9C5" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="110" y1="175" x2="140" y2="175" stroke="#A9C9A4" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="110" y1="182" x2="135" y2="182" stroke="#A9C9A4" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="110" y1="189" x2="142" y2="189" stroke="#A9C9A4" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="110" y1="196" x2="135" y2="196" stroke="#A9C9A4" stroke-width="1.5" stroke-linecap="round"/>
            </g>
          </svg>
        </div>

        <!-- Diary Page -->
        <div class="diary-page" id="diaryPage">
          <!-- Spiral -->
          <div class="spiral" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>

          <!-- Washi tapes -->
          <div class="tape t1" aria-hidden="true"></div>
          <div class="tape t2" aria-hidden="true"></div>
          <div class="tape t3" aria-hidden="true"></div>
          <div class="tape t4" aria-hidden="true"></div>

          <!-- Header -->
          <div class="diary-header">
            <div class="diary-date" data-i18n="diaryDate">Juillet 2026 🌸</div>
            <div class="diary-title" data-i18n="diaryTitle">Mon Journal Créatif</div>
          </div>

          <!-- Content -->
          <div class="diary-content">
            <div class="diary-note">
              <span id="diaryNote" data-i18n="note1">Mon premier projet de l'année ! J'adore vraiment ce design, il a été créé avec beaucoup d'amour</span>
              <span class="note-emoji" id="noteEmoji">🩷</span>
            </div>

            <div class="diary-image-wrap">
              <img class="portfolio-image" id="portfolioImage" src="portfolio/1.png" alt="Mon travail créatif — Capibara Designs">
              <div class="slide-label" id="slideLabel">Mon travail créatif</div>
            </div>
          </div>

          <!-- Footer -->
          <div class="diary-footer">
            <span>— page <span id="pageNum">01</span> sur 05 —</span>
          </div>
        </div>

      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="arrow-group">
        <button class="arrow" id="prevBtn" type="button" aria-label="Slide précédente">←</button>
        <button class="arrow" id="nextBtn" type="button" aria-label="Slide suivante">→</button>
      </div>
      <div class="dots" id="dots" aria-label="Navigation des slides"></div>
      <div class="counter" id="counter" aria-live="polite">01 / 05</div>
    </div>
  </main>

  <script>
    /* ============================================================
       TRADUCTIONS i18n — FR / EN / AR
       ============================================================ */
    const translations = {
      fr: {
        back:'Retour', backAria:'Retour au site principal',
        diaryDate:'Juillet 2026 🌸', diaryTitle:'Mon Journal Créatif',
        label1:'Mon travail créatif',
        label2:'Moodboard',
        label3:'Logos',
        label4:'Présentations PowerPoint',
        label5:'Cartes de visite',
        note1:'Mon premier projet de l\'année ! J\'adore vraiment ce design, il a été créé avec beaucoup d\'amour',
        note2:'Ma planche d\'inspiration. Les couleurs douces sont vraiment mon univers préféré',
        note3:'Le logo final ! Je l\'ai dessiné à la main avant de le vectoriser, c\'est ma méthode favorite',
        note4:'Des slides qui racontent une histoire. J\'aime quand une présentation émeut son public',
        note5:'Mes petites cartes de visite. Elles tiennent dans une poche mais portent tout un univers',
        emoji1:'🩷', emoji2:'🌸', emoji3:'✨', emoji4:'📖', emoji5:'💌',
        pageLabel:'page', ofLabel:'sur',
        prevAria:'Slide précédente', nextAria:'Slide suivante',
        dotsAria:'Navigation des slides',
        dotAria:(i)=>`Aller à la page ${i}`,
        title:'Portfolio — Capibara Designs', direction:'ltr'
      },
      en: {
        back:'Back', backAria:'Return to main site',
        diaryDate:'July 2026 🌸', diaryTitle:'My Creative Diary',
        label1:'My Creative Work',
        label2:'Moodboard',
        label3:'Logos',
        label4:'PowerPoint Presentations',
        label5:'Business Cards',
        note1:'My first project of the year! I really love this design, it was made with a lot of love',
        note2:'My inspiration board. Soft colors are truly my favorite universe',
        note3:'The final logo! I drew it by hand before vectorizing it, it\'s my favorite method',
        note4:'Slides that tell a story. I love when a presentation moves its audience',
        note5:'My little business cards. They fit in a pocket but carry a whole universe',
        emoji1:'🩷', emoji2:'🌸', emoji3:'✨', emoji4:'📖', emoji5:'💌',
        pageLabel:'page', ofLabel:'of',
        prevAria:'Previous slide', nextAria:'Next slide',
        dotsAria:'Slide navigation',
        dotAria:(i)=>`Go to page ${i}`,
        title:'Portfolio — Capibara Designs', direction:'ltr'
      },
      ar: {
        back:'رجوع', backAria:'العودة إلى الموقع الرئيسي',
        diaryDate:'يوليو 2026 🌸', diaryTitle:'مذكرتي الإبداعية',
        label1:'أعمالي الإبداعية',
        label2:'لوحة الإلهام',
        label3:'الشعارات',
        label4:'عروض PowerPoint',
        label5:'بطاقات العمل',
        note1:'أول مشروع لي هذا العام! أحب هذا التصميم كثيراً، صُنع بحب كبير',
        note2:'لوحة إلهامي. الألوان الناعمة هي عالمي المفضل حقاً',
        note3:'الشعار النهائي! رسمته بيدي قبل تحويله لمتجه، إنها طريقتي المفضلة',
        note4:'شرائح تحكي قصة. أحب عندما يثير العرض مشاعر الجمهور',
        note5:'بطاقات عملي الصغيرة. تتسع في الجيب لكنها تحمل عالماً كاملاً',
        emoji1:'🩷', emoji2:'🌸', emoji3:'✨', emoji4:'📖', emoji5:'💌',
        pageLabel:'صفحة', ofLabel:'من',
        prevAria:'الشريحة السابقة', nextAria:'الشريحة التالية',
        dotsAria:'التنقل بين الشرائح',
        dotAria:(i)=>`انتقل إلى الصفحة ${i}`,
        title:'الأعمال — كابيبارا ديزاينز', direction:'rtl'
      }
    };

    let currentLang = localStorage.getItem('capibara-lang') || 'fr';

    /* ============================================================
       WORKS DATA — الأعمال الخمسة
       ============================================================ */
    const works = [
      { src:'portfolio/1.png', labelKey:'label1', noteKey:'note1', emojiKey:'emoji1' },
      { src:'portfolio/2.png', labelKey:'label2', noteKey:'note2', emojiKey:'emoji2' },
      { src:'portfolio/3.png', labelKey:'label3', noteKey:'note3', emojiKey:'emoji3' },
      { src:'portfolio/4.png', labelKey:'label4', noteKey:'note4', emojiKey:'emoji4' },
      { src:'portfolio/5.png', labelKey:'label5', noteKey:'note5', emojiKey:'emoji5' }
    ];
    const slidesCount = works.length;

    /* ============================================================
       ELEMENTS
       ============================================================ */
    const portfolioImage = document.getElementById('portfolioImage');
    const slideLabel = document.getElementById('slideLabel');
    const diaryNote = document.getElementById('diaryNote');
    const noteEmoji = document.getElementById('noteEmoji');
    const pageNum = document.getElementById('pageNum');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');
    const pageTransition = document.getElementById('pageTransition');

    let currentSlide = 0;

    /* ============================================================
       CREATE DOTS
       ============================================================ */
    works.forEach((work, index) => {
      const dot = document.createElement('button');
      dot.className = 'dot';
      dot.type = 'button';
      dot.setAttribute('aria-label', translations[currentLang].dotAria(index + 1));
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => showSlide(index));
      dotsContainer.appendChild(dot);
    });
    const dots = document.querySelectorAll('.dot');

    /* ============================================================
       APPLY LANGUAGE
       ============================================================ */
    function applyLanguage(lang){
      currentLang = lang;
      localStorage.setItem('capibara-lang', lang);
      const t = translations[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = t.direction;
      document.title = t.title;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });

      document.getElementById('backBtn').setAttribute('aria-label', t.backAria);
      prevBtn.setAttribute('aria-label', t.prevAria);
      nextBtn.setAttribute('aria-label', t.nextAria);
      dotsContainer.setAttribute('aria-label', t.dotsAria);
      dots.forEach((dot, i) => dot.setAttribute('aria-label', t.dotAria(i + 1)));

      updateTexts();
    }

    /* ============================================================
       UPDATE TEXTS
       ============================================================ */
    function updateTexts(){
      const t = translations[currentLang];
      const work = works[currentSlide];
      slideLabel.textContent = t[work.labelKey];
      diaryNote.textContent = t[work.noteKey];
      noteEmoji.textContent = t[work.emojiKey];
      pageNum.textContent = String(currentSlide + 1).padStart(2, '0');
      portfolioImage.alt = t[work.labelKey] + ' — Capibara Designs';
    }

    /* ============================================================
       SHOW SLIDE — FADE TRANSITION
       ============================================================ */
    function showSlide(index){
      if (index < 0) index = slidesCount - 1;
      if (index >= slidesCount) index = 0;
      if (index === currentSlide) return;

      currentSlide = index;

      /* Fade out */
      portfolioImage.classList.add('fading');

      setTimeout(() => {
        /* Preload image */
        const pre = new Image();
        pre.src = works[index].src;
        pre.onload = () => {
          portfolioImage.src = works[index].src;
          portfolioImage.classList.remove('fading');
        };
        /* في حالة الصورة محملة مسبقاً */
        if (pre.complete) {
          portfolioImage.src = works[index].src;
          portfolioImage.classList.remove('fading');
        }
      }, 350);

      /* Update texts immediately for smooth feel */
      updateTexts();

      /* Update dots */
      dots.forEach(d => d.classList.remove('active'));
      dots[index].classList.add('active');

      /* Update counter */
      counter.textContent =
        String(index + 1).padStart(2,'0') + ' / ' + String(slidesCount).padStart(2,'0');
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    nextBtn.addEventListener('click', () => showSlide(currentSlide + 1));
    prevBtn.addEventListener('click', () => showSlide(currentSlide - 1));

    /* ============================================================
       KEYBOARD
       ============================================================ */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') showSlide(currentSlide + 1);
      if (e.key === 'ArrowLeft') showSlide(currentSlide - 1);
      if (e.key === 'Escape') goBack();
    });

    /* ============================================================
       TOUCH / SWIPE
       ============================================================ */
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive:true });
    document.addEventListener('touchend', (e) => {
      const distance = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(distance) < 50) return;
      if (distance < 0) showSlide(currentSlide + 1);
      else showSlide(currentSlide - 1);
    }, { passive:true });

    /* ============================================================
       MORPH TRANSITION
       ============================================================ */
    window.addEventListener('load', () => {
      applyLanguage(currentLang);
      requestAnimationFrame(() => {
        pageTransition.classList.remove('active');
      });
    });

    function goBack(){
      pageTransition.classList.add('active');
      setTimeout(() => {
        window.location.href = 'index.html#portfolio';
      }, 550);
    }
    document.getElementById('backBtn').addEventListener('click', goBack);
  </script>

</body>
